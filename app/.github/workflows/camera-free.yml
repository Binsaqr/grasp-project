name: Camera-free checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: camera-free-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  camera-free:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check shell syntax
        shell: bash
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(git ls-files -z '*.sh')

      - name: Build the supported ROS Humble runtime
        run: docker build --pull --tag grasp-project:runtime .

      - name: Add the JavaScript test runner to the CI image
        run: |
          docker build --tag grasp-project:ci --file - . <<'DOCKERFILE'
          FROM node:22-bookworm-slim AS javascript
          FROM grasp-project:runtime
          COPY --from=javascript /usr/local/bin/node /usr/local/bin/node
          COPY --from=javascript /usr/local/LICENSE /usr/local/share/doc/node/LICENSE
          RUN node --version
          DOCKERFILE

      - name: Check Python syntax and run camera-free tests
        run: |
          docker run --rm --network none --cap-drop ALL \
            --security-opt no-new-privileges --entrypoint bash grasp-project:ci \
            -lc 'source /opt/ros/humble/setup.bash && python3 -m compileall -q src gripper tests *.py && python3 -m pytest'
