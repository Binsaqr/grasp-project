<svg xmlns="http://www.w3.org/2000/svg" width="960" height="730" viewBox="0 0 960 730" role="img" aria-labelledby="title desc">
<title id="title">Software synchronization and action-anchored event windows</title><desc id="desc">Schematic, not recorded data. RGB-D frames, APS context, and asynchronous DAVIS events have separate acquisition times. An operator action timestamp anchors impact from 0 to 300 milliseconds, settle from 300 to 700 milliseconds, and stability from 700 to 1200 milliseconds. Software freshness and offset checks do not establish shared clocks or spatial calibration.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/></marker></defs>
<g font-family="DejaVu Sans, Arial, sans-serif"><rect x="0" y="0" width="960" height="730" rx="22" fill="#0D1523"/><text x="40" y="48" fill="#63E3CC" font-size="16" font-weight="700" text-anchor="start">SOFTWARE SYNCHRONIZATION</text><text x="40" y="94" fill="#F1F5F9" font-size="32" font-weight="700" text-anchor="start">Align evidence with the handling phase.</text><text x="40" y="128" fill="#BFCCDE" font-size="20" font-weight="400" text-anchor="start">Schematic acquisition pattern; no measured rates or latency</text><text x="40" y="227" fill="#63E3CC" font-size="21" font-weight="700" text-anchor="start">RGB-D frames</text><path d="M 226 220 H 914" fill="none" stroke="#64748B" stroke-width="3"/><text x="40" y="317" fill="#C5B4FF" font-size="21" font-weight="700" text-anchor="start">APS context</text><path d="M 226 310 H 914" fill="none" stroke="#64748B" stroke-width="3"/><text x="40" y="407" fill="#C5B4FF" font-size="21" font-weight="700" text-anchor="start">DAVIS events</text><path d="M 226 400 H 914" fill="none" stroke="#64748B" stroke-width="3"/><rect x="235" y="202" width="14" height="36" rx="3" fill="#63E3CC"/><rect x="323" y="202" width="14" height="36" rx="3" fill="#63E3CC"/><rect x="411" y="202" width="14" height="36" rx="3" fill="#63E3CC"/><rect x="499" y="202" width="14" height="36" rx="3" fill="#63E3CC"/><rect x="587" y="202" width="14" height="36" rx="3" fill="#63E3CC"/><rect x="675" y="202" width="14" height="36" rx="3" fill="#63E3CC"/><rect x="763" y="202" width="14" height="36" rx="3" fill="#63E3CC"/><rect x="851" y="202" width="14" height="36" rx="3" fill="#63E3CC"/><rect x="226" y="294" width="16" height="32" rx="3" fill="#C5B4FF"/><rect x="466" y="294" width="16" height="32" rx="3" fill="#C5B4FF"/><rect x="706" y="294" width="16" height="32" rx="3" fill="#C5B4FF"/><rect x="882" y="294" width="16" height="32" rx="3" fill="#C5B4FF"/><path d="M 230 390 V 410" fill="none" stroke="#C5B4FF" stroke-width="3"/><path d="M 244 382 V 418" fill="none" stroke="#C5B4FF" stroke-width="3"/><path d="M 265 374 V 426" fill="none" stroke="#C5B4FF" stroke-width="3"/><path d="M 271 385 V 415" fill="none" stroke="#C5B4FF" stroke-width="3"/><path d="M 279 378 V 422" fill="none" stroke="#C5B4FF" stroke-width="3"/><path d="M 284 390 V 410" fill="none" stroke="#C5B4FF" stroke-width="3"/><path d="M 290 382 V 418" fill="none" stroke="#C5B4FF" stroke-width="3"/><path d="M 297 374 V 426" fill="none" stroke="#C5B4FF" stroke-width="3"/><path d="M 305 385 V 415" fill="none" stroke="#C5B4FF" stroke-width="3"/><path d="M 315 378 V 422" fill="none" stroke="#C5B4FF" stroke-width="3"/><path d="M 327 390 V 410" fill="none" stroke="#C5B4FF" stroke-width="3"/><path d="M 338 382 V 418" fill="none" stroke="#C5B4FF" stroke-width="3"/><path d="M 348 374 V 426" fill="none" stroke="#C5B4FF" stroke-width="3"/><path d="M 365 385 V 415" fill="none" stroke="#C5B4FF" stroke-width="3"/><path d="M 380 378 V 422" fill="none" stroke="#C5B4FF" stroke-width="3"/><path d="M 397 390 V 410" fill="none" stroke="#C5B4FF" stroke-width="3"/><path d="M 419 382 V 418" fill="none" stroke="#C5B4FF" stroke-width="3"/><path d="M 438 374 V 426" fill="none" stroke="#C5B4FF" stroke-width="3"/><path d="M 460 385 V 415" fill="none" stroke="#C5B4FF" stroke-width="3"/><path d="M 477 378 V 422" fill="none" stroke="#C5B4FF" stroke-width="3"/><path d="M 496 390 V 410" fill="none" stroke="#C5B4FF" stroke-width="3"/><path d="M 519 382 V 418" fill="none" stroke="#C5B4FF" stroke-width="3"/><path d="M 544 374 V 426" fill="none" stroke="#C5B4FF" stroke-width="3"/><path d="M 575 385 V 415" fill="none" stroke="#C5B4FF" stroke-width="3"/><path d="M 610 378 V 422" fill="none" stroke="#C5B4FF" stroke-width="3"/><path d="M 640 390 V 410" fill="none" stroke="#C5B4FF" stroke-width="3"/><path d="M 675 382 V 418" fill="none" stroke="#C5B4FF" stroke-width="3"/><path d="M 711 374 V 426" fill="none" stroke="#C5B4FF" stroke-width="3"/><path d="M 746 385 V 415" fill="none" stroke="#C5B4FF" stroke-width="3"/><path d="M 782 378 V 422" fill="none" stroke="#C5B4FF" stroke-width="3"/><path d="M 819 390 V 410" fill="none" stroke="#C5B4FF" stroke-width="3"/><path d="M 850 382 V 418" fill="none" stroke="#C5B4FF" stroke-width="3"/><path d="M 886 374 V 426" fill="none" stroke="#C5B4FF" stroke-width="3"/><path d="M 250 160 V 548" fill="none" stroke="#FFD58A" stroke-width="3" stroke-dasharray="7 6"/><text x="262" y="180" fill="#FFD58A" font-size="20" font-weight="700" text-anchor="start">Operator action t₀</text><text x="40" y="498" fill="#F1F5F9" font-size="21" font-weight="700" text-anchor="start">Post-action</text><text x="40" y="526" fill="#F1F5F9" font-size="21" font-weight="700" text-anchor="start">windows</text><rect x="250" y="468" width="162" height="85" rx="8" fill="#172235" stroke="#FFD58A" stroke-width="2"/><text x="331.0" y="503" fill="#FFD58A" font-size="23" font-weight="700" text-anchor="middle">Impact</text><text x="331.0" y="534" fill="#BFCCDE" font-size="18" font-weight="400" text-anchor="middle">0–300 ms</text><rect x="412" y="468" width="216" height="85" rx="8" fill="#172235" stroke="#9DC4FF" stroke-width="2"/><text x="520.0" y="503" fill="#9DC4FF" font-size="23" font-weight="700" text-anchor="middle">Settle</text><text x="520.0" y="534" fill="#BFCCDE" font-size="18" font-weight="400" text-anchor="middle">300–700 ms</text><rect x="628" y="468" width="272" height="85" rx="8" fill="#172235" stroke="#63E3CC" stroke-width="2"/><text x="764.0" y="503" fill="#63E3CC" font-size="23" font-weight="700" text-anchor="middle">Stability</text><text x="764.0" y="534" fill="#BFCCDE" font-size="18" font-weight="400" text-anchor="middle">700–1200 ms</text><rect x="40" y="592" width="880" height="92" rx="16" fill="#172235"/><text x="64" y="628" fill="#F1F5F9" font-size="24" font-weight="700" text-anchor="start">Separate checks: age · sensor offset · event validity</text><text x="64" y="662" fill="#BFCCDE" font-size="22" font-weight="400" text-anchor="start">Temporal alignment does not establish spatial calibration.</text><text x="40" y="711" fill="#BFCCDE" font-size="19" font-weight="400" text-anchor="start">Action anchoring uses software timestamps, not hardware trigger pulses.</text></g></svg>