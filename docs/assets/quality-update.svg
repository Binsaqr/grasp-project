<svg xmlns="http://www.w3.org/2000/svg" width="960" height="966" viewBox="0 0 960 966" role="img" aria-labelledby="title desc">
<title id="title">Analytic quality and live quality update</title><desc id="desc">A normalized analytic baseline and eligible weighted risk penalties form a raw live score. Immediate hard gates cap or block the live estimate; otherwise the score is temporally smoothed. The analytic epsilon and baseline are unchanged by the live update. Excluded evidence is not a confirmation of stability.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/></marker></defs>
<g font-family="DejaVu Sans, Arial, sans-serif"><rect x="0" y="0" width="960" height="966" rx="22" fill="#0D1523"/><text x="40" y="48" fill="#63E3CC" font-size="16" font-weight="700" text-anchor="start">QUALITY MODEL</text><text x="40" y="94" fill="#F1F5F9" font-size="32" font-weight="700" text-anchor="start">Keep the baseline. Explain the change.</text><text x="40" y="128" fill="#BFCCDE" font-size="20" font-weight="400" text-anchor="start">Conceptual update path | intended behavior, not a physical result</text><rect x="40" y="170" width="420" height="146" rx="16" fill="#172235" stroke="#63E3CC" stroke-width="2"/><text x="64" y="204" fill="#63E3CC" font-size="16" font-weight="700" text-anchor="start">FIXED FOR THE LOCK</text><text x="64" y="241" fill="#F1F5F9" font-size="27" font-weight="700" text-anchor="start">Normalized baseline</text><text x="64" y="276" fill="#BFCCDE" font-size="21" font-weight="400" text-anchor="start">Derived from analytic quality</text><text x="64" y="305" fill="#BFCCDE" font-size="21" font-weight="400" text-anchor="start">Not the raw epsilon value</text><rect x="500" y="170" width="420" height="146" rx="16" fill="#172235" stroke="#C5B4FF" stroke-width="2"/><text x="524" y="204" fill="#C5B4FF" font-size="16" font-weight="700" text-anchor="start">CURRENT AND ELIGIBLE</text><text x="524" y="241" fill="#F1F5F9" font-size="27" font-weight="700" text-anchor="start">Weighted risk penalties</text><text x="524" y="276" fill="#BFCCDE" font-size="21" font-weight="400" text-anchor="start">Motion, geometry and uncertainty</text><text x="524" y="305" fill="#BFCCDE" font-size="21" font-weight="400" text-anchor="start">Terms depend on active mode</text><path d="M 250 316 V 344 H 430 V 371" fill="none" stroke="#63E3CC" stroke-width="3" marker-end="url(#arrow)"/><path d="M 710 316 V 344 H 530 V 371" fill="none" stroke="#C5B4FF" stroke-width="3" marker-end="url(#arrow)"/><rect x="160" y="376" width="640" height="90" rx="16" fill="#172235" stroke="#9DC4FF" stroke-width="2"/><text x="480" y="414" fill="#F1F5F9" font-size="27" font-weight="700" text-anchor="middle">Raw live score</text><text x="480" y="446" fill="#BFCCDE" font-size="21" font-weight="400" text-anchor="middle">Normalized baseline − eligible weighted penalties</text><path d="M 480 466 V 500" fill="none" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/><path d="M 480 505 L 640 575 L 480 645 L 320 575 Z" fill="#172235" stroke="#FFD58A" stroke-width="2"/><text x="480" y="569" fill="#F1F5F9" font-size="25" font-weight="700" text-anchor="middle">Hard gate</text><text x="480" y="600" fill="#F1F5F9" font-size="25" font-weight="700" text-anchor="middle">active?</text><path d="M 320 575 H 250 V 688" fill="none" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/><text x="267" y="562" fill="#BFCCDE" font-size="19" font-weight="400" text-anchor="start">No</text><path d="M 640 575 H 710 V 688" fill="none" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/><text x="663" y="562" fill="#FFD58A" font-size="19" font-weight="400" text-anchor="start">Yes</text><rect x="40" y="694" width="420" height="84" rx="16" fill="#172235" stroke="#9DC4FF" stroke-width="2"/><text x="250" y="729" fill="#F1F5F9" font-size="24" font-weight="700" text-anchor="middle">Temporal smoothing</text><text x="250" y="758" fill="#BFCCDE" font-size="19" font-weight="400" text-anchor="middle">Risk drop and recovery handling</text><rect x="500" y="694" width="420" height="84" rx="16" fill="#172235" stroke="#FFD58A" stroke-width="2"/><text x="710" y="729" fill="#F1F5F9" font-size="24" font-weight="700" text-anchor="middle">Immediate cap / block</text><text x="710" y="758" fill="#BFCCDE" font-size="19" font-weight="400" text-anchor="middle">Bypasses smoothing</text><path d="M 250 778 V 812 H 430 V 838" fill="none" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/><path d="M 710 778 V 812 H 530 V 838" fill="none" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/><rect x="225" y="844" width="510" height="60" rx="16" fill="#172235" stroke="#63E3CC" stroke-width="2"/><text x="480" y="883" fill="#F1F5F9" font-size="25" font-weight="700" text-anchor="middle">Live operational quality estimate</text><text x="480" y="942" fill="#BFCCDE" font-size="21" font-weight="400" text-anchor="middle">The analytic epsilon and locked baseline are not overwritten.</text></g></svg>