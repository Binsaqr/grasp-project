<svg xmlns="http://www.w3.org/2000/svg" width="960" height="790" viewBox="0 0 960 790" role="img" aria-labelledby="title desc">
<title id="title">RGB-D and DAVIS grasp-quality workflow</title><desc id="desc">Intended hand-operated demo flow. RealSense provides locked geometry and analytic quality. DAVIS provides APS context and events; timing, locality, provenance, and disturbance checks determine eligibility. A separate live operational estimate uses the baseline and eligible evidence. This is a method diagram, not a validation result.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/></marker></defs>
<g font-family="DejaVu Sans, Arial, sans-serif"><rect x="0" y="0" width="960" height="790" rx="22" fill="#0D1523"/><text x="40" y="48" fill="#63E3CC" font-size="16" font-weight="700" text-anchor="start">SYSTEM OVERVIEW</text><text x="40" y="94" fill="#F1F5F9" font-size="32" font-weight="700" text-anchor="start">Two sensing paths. Two quality views.</text><text x="40" y="128" fill="#BFCCDE" font-size="20" font-weight="400" text-anchor="start">Hand-operated bottle demo | intended evidence flow</text><rect x="40" y="170" width="420" height="146" rx="16" fill="#172235" stroke="#63E3CC" stroke-width="2"/><text x="64" y="204" fill="#63E3CC" font-size="16" font-weight="700" text-anchor="start">01 / GEOMETRY</text><text x="64" y="241" fill="#F1F5F9" font-size="27" font-weight="700" text-anchor="start">RealSense RGB-D</text><text x="64" y="276" fill="#BFCCDE" font-size="21" font-weight="400" text-anchor="start">Bottle shape, aligned depth,</text><text x="64" y="305" fill="#BFCCDE" font-size="21" font-weight="400" text-anchor="start">and estimated contact regions</text><rect x="500" y="170" width="420" height="146" rx="16" fill="#172235" stroke="#C5B4FF" stroke-width="2"/><text x="524" y="204" fill="#C5B4FF" font-size="16" font-weight="700" text-anchor="start">02 / MOTION</text><text x="524" y="241" fill="#F1F5F9" font-size="27" font-weight="700" text-anchor="start">DAVIS346</text><text x="524" y="276" fill="#BFCCDE" font-size="21" font-weight="400" text-anchor="start">APS context and asynchronous</text><text x="524" y="305" fill="#BFCCDE" font-size="21" font-weight="400" text-anchor="start">brightness-change events</text><path d="M 250 316 V 350" fill="none" stroke="#63E3CC" stroke-width="3" marker-end="url(#arrow)"/><path d="M 710 316 V 350" fill="none" stroke="#C5B4FF" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="354" width="420" height="174" rx="16" fill="#172235" stroke="#63E3CC" stroke-width="2"/><text x="64" y="388" fill="#63E3CC" font-size="16" font-weight="700" text-anchor="start">LOCKED SNAPSHOT</text><text x="64" y="425" fill="#F1F5F9" font-size="27" font-weight="700" text-anchor="start">Analytic quality</text><text x="64" y="460" fill="#BFCCDE" font-size="21" font-weight="400" text-anchor="start">Epsilon / wrench-space result</text><text x="64" y="489" fill="#BFCCDE" font-size="21" font-weight="400" text-anchor="start">Baseline tied to one grasp lock</text><text x="64" y="518" fill="#BFCCDE" font-size="21" font-weight="400" text-anchor="start">Fixed until recomputation</text><rect x="500" y="354" width="420" height="174" rx="16" fill="#172235" stroke="#C5B4FF" stroke-width="2"/><text x="524" y="388" fill="#C5B4FF" font-size="16" font-weight="700" text-anchor="start">EVIDENCE ELIGIBILITY</text><text x="524" y="425" fill="#F1F5F9" font-size="27" font-weight="700" text-anchor="start">Motion-risk cues</text><text x="524" y="460" fill="#BFCCDE" font-size="21" font-weight="400" text-anchor="start">Timing, locality and provenance</text><text x="524" y="489" fill="#BFCCDE" font-size="21" font-weight="400" text-anchor="start">Disturbance / post-grasp checks</text><text x="524" y="518" fill="#BFCCDE" font-size="21" font-weight="400" text-anchor="start">Ineligible cues are excluded</text><path d="M 250 528 V 561 H 430 V 593" fill="none" stroke="#63E3CC" stroke-width="3" marker-end="url(#arrow)"/><path d="M 710 528 V 561 H 530 V 593" fill="none" stroke="#C5B4FF" stroke-width="3" marker-end="url(#arrow)"/><rect x="190" y="598" width="580" height="124" rx="16" fill="#172235" stroke="#9DC4FF" stroke-width="2"/><text x="480" y="639" fill="#F1F5F9" font-size="29" font-weight="700" text-anchor="middle">Live operational quality</text><text x="480" y="677" fill="#BFCCDE" font-size="22" font-weight="400" text-anchor="middle">Baseline + eligible evidence + risk handling</text><text x="480" y="760" fill="#BFCCDE" font-size="21" font-weight="400" text-anchor="middle">Dashboard shows both values and explains each contribution.</text></g></svg>